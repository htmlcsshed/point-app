<h2>ダッシュボード</h2>
<p>{{ username }} / {{ points }}pt</p>

<h3>ポイント送信</h3>
<form method="post" action="/send">
  <select name="to">
    {% for name in users %}
      {% if name != username %}
        <option value="{{ name }}">{{ name }}</option>
      {% endif %}
    {% endfor %}
  </select>
  <input name="amount" type="number">
  <button>送信</button>
</form>

{% if is_admin %}
<hr>
<h3>管理者メニュー</h3>
<ul>
  <li><a href="/admin">ユーザー管理</a></li>
  <li><a href="/change_password">管理者パスワード変更</a></li>
</ul>

<h3>管理者ポイント付与</h3>
<form method="post" action="/add">
  <select name="to">
    {% for name in users %}
      <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>
  <input name="amount" type="number">
  <button>付与</button>
</form>
{% endif %}

<hr>
<a href="/logout">ログアウト</a>
